<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hospital Patient Information System</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/axios.min.js"></script>
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <img src="logo.png" alt="Hospital Logo" class="login-logo">
                <h1>Hospital Patient Information System</h1>
                <p class="login-subtitle">Sign in with your username and password</p>
            </div>

            <div id="login-alert" class="alert alert-danger" style="display: none;" role="alert"></div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" autocomplete="username" required autofocus placeholder="Enter your username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required placeholder="Enter your password" style="padding-right: 40px;">
                        <button type="button" id="btn-toggle-password" aria-label="Show password" title="Show password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #6c757d; padding: 0; display: flex; align-items: center; justify-content: center;">
                            <svg id="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            <svg id="icon-eye-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btn-login" class="btn btn-primary btn-block">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-spinner" style="display: none;">Authenticating...</span>
                </button>
            </form>

            <div class="login-footer">
                <p class="text-muted text-center"><small>&copy; <span id="current-year"></span> Hospital Information System. All rights reserved.</small></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('current-year').textContent = new Date().getFullYear();

            const dashboards = {
                'Administrator': 'admin_dashboard.html',
                'Doctor': 'doctor_dashboard.html',
                'Receptionist': 'receptionist_dashboard.html'
            };

            axios.get('api/auth_controller.php?action=me', {
                headers: { 'Accept': 'application/json' }
            }).then((response) => {
                const user = response.data && response.data.data ? response.data.data.user : null;
                if (user && dashboards[user.role_name]) {
                    window.location.replace(dashboards[user.role_name]);
                }
            }).catch(() => {
                // No active session: keep showing the login form
            });

            const form = document.getElementById('login-form');
            const alertBox = document.getElementById('login-alert');
            const btnLogin = document.getElementById('btn-login');
            const btnText = btnLogin.querySelector('.btn-text');
            const btnSpinner = btnLogin.querySelector('.btn-spinner');
            
            const btnTogglePassword = document.getElementById('btn-toggle-password');
            const passwordInput = document.getElementById('password');
            const iconEyeOff = document.getElementById('icon-eye-off');
            const iconEyeOn = document.getElementById('icon-eye-on');

            if (btnTogglePassword && passwordInput) {
                btnTogglePassword.addEventListener('click', () => {
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        iconEyeOff.style.display = 'none';
                        iconEyeOn.style.display = 'block';
                        btnTogglePassword.setAttribute('aria-label', 'Hide password');
                        btnTogglePassword.setAttribute('title', 'Hide password');
                    } else {
                        passwordInput.type = 'password';
                        iconEyeOn.style.display = 'none';
                        iconEyeOff.style.display = 'block';
                        btnTogglePassword.setAttribute('aria-label', 'Show password');
                        btnTogglePassword.setAttribute('title', 'Show password');
                    }
                });
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.style.display = 'none';
                alertBox.textContent = '';

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                if (!username || !password) {
                    alertBox.textContent = 'Please enter both username and password.';
                    alertBox.style.display = 'block';
                    return;
                }

                btnLogin.disabled = true;
                btnText.style.display = 'none';
                btnSpinner.style.display = 'inline';

                try {
                    const response = await axios.post('api/auth_controller.php?action=login', {
                        username: username,
                        password: password
                    }, {
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    if (response.data && response.data.success) {
                        window.location.href = response.data.data.redirect || 'admin_dashboard.html';
                    } else {
                        throw new Error(response.data.message || 'Login failed.');
                    }
                } catch (err) {
                    let msg = 'Invalid username or password.';
                    if (err.response && err.response.data && err.response.data.message) {
                        msg = err.response.data.message;
                    }
                    alertBox.textContent = msg;
                    alertBox.style.display = 'block';
                } finally {
                    btnLogin.disabled = false;
                    btnText.style.display = 'inline';
                    btnSpinner.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
